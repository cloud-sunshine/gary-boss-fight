<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defeat Gary - Boss Leaderboard</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .boss-container { margin: 40px auto; max-width: 500px; background: #2a2a2a; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        /* Styling for Gary's Portrait Container */
        .boss-avatar-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Make sure the image scales down nicely without breaking the layout */
        .boss-avatar-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hp-bar-bg { background: #444; width: 100%; height: 30px; border-radius: 15px; overflow: hidden; margin-top: 15px; border: 2px solid #555; }
        .hp-bar-fill { background: #2ecc71; width: 100%; height: 100%; transition: width 0.4s ease, background-color 0.4s ease; }
        .leaderboard-table { margin: 30px auto; width: 90%; max-width: 800px; border-collapse: collapse; background: #222; border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px; border: 1px solid #333; text-align: center; }
        th { background-color: #333; color: #00ffcc; text-transform: uppercase; letter-spacing: 1px; }
        tr:nth-child(even) { background-color: #282828; }
        .winner { background-color: #f1c40f !important; color: black; font-weight: bold; }
        .winner td { border-color: #f1c40f; }
        #error-msg { color: #e74c3c; margin: 10px; font-weight: bold; display: none; }
    </style></head><body>

    <h1>💥 DEFEAT GARY 💥</h1>
    
    <div class="boss-container">
        <!-- ADDED: Container for Gary's evolving picture -->
        <div class="boss-avatar-container">
            <img id="gary-image" src="" alt="Gary the Boss">
        </div>

        <h2>Boss HP: <span id="boss-hp-text">1000</span> / 1000</h2>
        <div class="hp-bar-bg">
            <div id="hp-fill" class="hp-bar-fill"></div>
        </div>
    </div>

    <div id="error-msg">Connecting to Live Game Data...</div>

    <h2>Leaderboard</h2>
    <table class="leaderboard-table">
        <thead>
            <tr>
                <th>Team</th>
                <th>Phase 1</th>
                <th>Phase 2</th>
                <th>Phase 3</th>
                <th>Total Points</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr>
                <td colspan="5">Loading game data...</td>
            </tr>
        </tbody>
    </table>

    <script>
        const BASE_URL = "https://script.google.com/macros/s/AKfycbxVN-UxdUnAcug88FPclPVR0LIJ_rmBR45jZyVzibW9YweWG1MGpCG8rmUdCR_PFkCz/exec";
        const GARY_STAGE_1 = "gary1.jpg"; // 1000 ~ 501 HP
        const GARY_STAGE_2 = "gary2.jpg"; // 500 ~ 101 HP
        const GARY_STAGE_3 = "gary3.jpg"; // 100 ~ 0 HP

        async function fetchGameData() {
            try {
                const response = await fetch(BASE_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const rows = await response.json();
                if (!rows || rows.length === 0) return;

                document.getElementById("error-msg").style.display = "none";
                
                if (rows[1] && rows[1][1] !== undefined) {
                    let hpRaw = rows[1][1].toString().replace(/[^0-9.-]+/g, "");
                    let currentHP = parseInt(hpRaw, 10);
                    
                    if (isNaN(currentHP)) currentHP = 1000;
                    if (currentHP < 0) currentHP = 0;
                    if (currentHP > 1000) currentHP = 1000;

                    updateBossUI(currentHP);
                }

                if (rows.length >= 9) {
                    const teamRows = rows.slice(4, 9); 
                    updateLeaderboardUI(teamRows);
                }

            } catch (error) {
                console.error("Error loading data:", error);
                const errMsg = document.getElementById("error-msg");
                errMsg.innerText = "⚠️ Connection Error. Checking for live updates...";
                errMsg.style.display = "block";
            }
        }

        function updateBossUI(hp) {
            document.getElementById("boss-hp-text").innerText = hp;
            const hpPercent = (hp / 1000) * 100;
            const hpFill = document.getElementById("hp-fill");
            const garyImgElement = document.getElementById("gary-image");
            
            hpFill.style.width = hpPercent + "%";

            // LOGIC FOR CHANGING GARY'S STAGE IMAGE AND HP BAR COLORS
            if (hp <= 100) {
                // Stage 3: Total Enraged (Below 100 HP)
                garyImgElement.src = GARY_STAGE_3;
                hpFill.style.backgroundColor = "#e74c3c"; 
            } 
            else if (hp <= 500) {
                // Stage 2: Getting Pissed (500 ~ 101 HP)
                garyImgElement.src = GARY_STAGE_2;
                hpFill.style.backgroundColor = "#f1c40f"; 
            } 
            else {
                // Stage 1: Slightly Mad (1000 ~ 501 HP)
                garyImgElement.src = GARY_STAGE_1;
                hpFill.style.backgroundColor = "#2ecc71"; 
            }
        }

        function updateLeaderboardUI(teams) {
            const tbody = document.getElementById("leaderboard-body");
            let htmlContent = "";

            const scores = teams.map(t => {
                let scoreRaw = t[4] ? t[4].toString().replace(/[^0-9.-]+/g, "") : "0";
                let num = parseInt(scoreRaw, 10);
                return isNaN(num) ? 0 : num;
            });
            
            const maxScore = Math.max(...scores);

            teams.forEach((team, index) => {
                const currentTeamScore = scores[index];
                const isWinner = currentTeamScore === maxScore && maxScore > 0;
                
                const name = team[0] || ("Group " + (index + 1));
                const p1 = team[1] || "0";
                const p2 = team[2] || "0";
                const p3 = team[3] || "0";

                htmlContent += `
                    <tr class="${isWinner ? 'winner' : ''}">
                        <td><strong>${name}</strong></td>
                        <td>${p1}</td>
                        <td>${p2}</td>
                        <td>${p3}</td>
                        <td><strong>${currentTeamScore}</strong></td>
                    </tr>
                `;
            });

            tbody.innerHTML = htmlContent;
        }

        fetchGameData();
        setInterval(fetchGameData, 4000);
    </script></body></html>
