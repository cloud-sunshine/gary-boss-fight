<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defeat Gary - Boss Leaderboard</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .boss-container { margin: 40px auto; max-width: 500px; background: #2a2a2a; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hp-bar-bg { background: #444; width: 100%; height: 30px; border-radius: 15px; overflow: hidden; margin-top: 15px; border: 2px solid #555; }
        .hp-bar-fill { background: #2ecc71; width: 100%; height: 100%; transition: width 0.4s ease, background-color 0.4s ease; }
        .leaderboard-table { margin: 30px auto; width: 90%; max-width: 800px; border-collapse: collapse; background: #222; border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px; border: 1px solid #333; text-align: center; }
        th { background-color: #333; color: #00ffcc; text-transform: uppercase; letter-spacing: 1px; }
        tr:nth-child(even) { background-color: #282828; }
        .winner { background-color: #f1c40f !important; color: black; font-weight: bold; }
        .winner td { border-color: #f1c40f; }
        #error-msg { color: #e74c3c; margin: 10px; font-weight: bold; display: none; }
    </style></head><body>

    <h1>💥 DEFEAT GARY 💥</h1>
    
    <div class="boss-container">
        <h2>Boss HP: <span id="boss-hp-text">1000</span> / 1000</h2>
        <div class="hp-bar-bg">
            <div id="hp-fill" class="hp-bar-fill"></div>
        </div>
    </div>

    <div id="error-msg">Connecting to Google Sheets...</div>

    <h2>Leaderboard</h2>
    <table class="leaderboard-table">
        <thead>
            <tr>
                <th>Team</th>
                <th>Phase 1</th>
                <th>Phase 2</th>
                <th>Phase 3</th>
                <th>Total Points</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body">
            <tr>
                <td colspan="5">Loading game data...</td>
            </tr>
        </tbody>
    </table>

    <script>
        const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTB53aTMBF5L3BFe-aELn_AfCMwmF6GilxzgoJarCFI_U47tmG1N9SBEEfDimF6h4IzCHyHrsUG8agL/pub?gid=0&single=true&output=csv";
        
        // Track the current UI health to prevent the rubberbanding jump
        let currentLocalHP = 1000;
        let isFirstLoad = true;

        async function fetchGameData() {
            try {
                // Smart cache bypass: checks if link already contains a '?' character
                const separator = BASE_URL.includes('?') ? '&' : '?';
                const finalUrl = BASE_URL + separator + "cacheBust=" + new Date().getTime();
                
                const response = await fetch(finalUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.text();
                if (!data || data.trim() === "") return;

                document.getElementById("error-msg").style.display = "none";

                // Parse rows cleanly
                const rows = data.split(/\r?\n/).map(row => row.split(","));
                
                // Process Boss HP (Cell B2 -> Row index 1, Column index 1)
                if (rows[1] && rows[1][1] !== undefined) {
                    let hpRaw = rows[1][1].replace(/[^0-9.-]+/g, "");
                    let fetchedHP = parseInt(hpRaw, 10);
                    
                    if (isNaN(fetchedHP)) fetchedHP = 1000;
                    if (fetchedHP < 0) fetchedHP = 0;
                    if (fetchedHP > 1000) fetchedHP = 1000;

                    // FIX: Only update UI if it's the initial load, OR if Gary actually lost health.
                    // This blocks older cached sheets data from "healing" Gary back up.
                    if (isFirstLoad || fetchedHP <= currentLocalHP) {
                        currentLocalHP = fetchedHP;
                        updateBossUI(currentLocalHP);
                        isFirstLoad = false;
                    }
                }

                // Process Teams Leaderboard (Rows 5 to 9 -> Row indexes 4 to 8)
                if (rows.length >= 9) {
                    const teamRows = rows.slice(4, 9); 
                    updateLeaderboardUI(teamRows);
                }

            } catch (error) {
                console.error("Error loading data:", error);
                const errMsg = document.getElementById("error-msg");
                errMsg.innerText = "⚠️ Connection Error. Checking for new data updates...";
                errMsg.style.display = "block";
            }
        }

        function updateBossUI(hp) {
            document.getElementById("boss-hp-text").innerText = hp;
            const hpPercent = (hp / 1000) * 100;
            const hpFill = document.getElementById("hp-fill");
            hpFill.style.width = hpPercent + "%";

            if (hp <= 200) hpFill.style.backgroundColor = "#e74c3c"; 
            else if (hp <= 500) hpFill.style.backgroundColor = "#f1c40f"; 
            else hpFill.style.backgroundColor = "#2ecc71"; 
        }

        function updateLeaderboardUI(teams) {
            const tbody = document.getElementById("leaderboard-body");
            let htmlContent = "";

            const scores = teams.map(t => {
                let scoreRaw = t[4] ? t[4].replace(/[^0-9.-]+/g, "") : "0";
                let num = parseInt(scoreRaw, 10);
                return isNaN(num) ? 0 : num;
            });
            
            const maxScore = Math.max(...scores);

            teams.forEach((team, index) => {
                const currentTeamScore = scores[index];
                const isWinner = currentTeamScore === maxScore && maxScore > 0;
                
                const name = team[0] || ("Group " + (index + 1));
                const p1 = team[1] || "0";
                const p2 = team[2] || "0";
                const p3 = team[3] || "0";

                htmlContent += `
                    <tr class="${isWinner ? 'winner' : ''}">
                        <td><strong>${name}</strong></td>
                        <td>${p1}</td>
                        <td>${p2}</td>
                        <td>${p3}</td>
                        <td><strong>${currentTeamScore}</strong></td>
                    </tr>
                `;
            });

            tbody.innerHTML = htmlContent;
        }

        // Run immediately on page load
        fetchGameData();
        
        // Check for updates every 15 seconds (15000ms) instead of 5 to give Google Sheets time to export
        setInterval(fetchGameData, 15000);
    </script></body></html>
