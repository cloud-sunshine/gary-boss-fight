<script>
        // Paste your Google Sheets CSV link here
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTB53aTMBF5L3BFe-aELn_AfCMwmF6GilxzgoJarCFI_U47tmG1N9SBEEfDimF6h4IzCHyHrsUG8agL/pub?gid=0&single=true&output=csv" + "&t=" + new Date().getTime();

        async function fetchGameData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                
                // Parse CSV into clean rows and clean up weird whitespace/linebreaks
                const rows = data.split(/\r?\n/).map(row => row.split(","));
                
                // TARGET CELL B2 (Row index 1, Column index 1)
                // Clean the data: remove whitespace or text artifacts to force a number
                let hpRaw = rows[1][1].replace(/[^0-9.-]+/g, "");
                let currentHP = parseInt(hpRaw, 10);
                
                // Fallback safeguards so it never accidentally drops to 0 mid-game
                if (isNaN(currentHP)) currentHP = 1000;
                if (currentHP < 0) currentHP = 0;
                if (currentHP > 1000) currentHP = 1000;

                updateBossUI(currentHP);

                // TARGET ROWS 5 TO 9 (Row indexes 4 through 8)
                const teamRows = rows.slice(4, 9); 
                updateLeaderboardUI(teamRows);

            } catch (error) {
                console.error("Error loading data from Google Sheets:", error);
            }
        }

        function updateBossUI(hp) {
            document.getElementById("boss-hp-text").innerText = hp;
            const hpPercent = (hp / 1000) * 100;
            const hpFill = document.getElementById("hp-fill");
            hpFill.style.width = `${hpPercent}%`;

            // Dynamic color threshold shifts
            if (hp <= 200) hpFill.style.backgroundColor = "#e74c3c"; // Red
            else if (hp <= 500) hpFill.style.backgroundColor = "#f1c40f"; // Yellow
            else hpFill.style.backgroundColor = "#2ecc71"; // Green
        }

        function updateLeaderboardUI(teams) {
            const tbody = document.getElementById("leaderboard-body");
            tbody.innerHTML = ""; 

            // Safely parse out total scores from Column E (index 4)
            const scores = teams.map(t => {
                let scoreRaw = t[4] ? t[4].replace(/[^0-9.-]+/g, "") : "0";
                let num = parseInt(scoreRaw, 10);
                return isNaN(num) ? 0 : num;
            });
            
            const maxScore = Math.max(...scores);

            teams.forEach((team, index) => {
                const currentTeamScore = scores[index];
                const isWinner = currentTeamScore === maxScore && maxScore > 0;
                
                // Safely handle missing items or offsets gracefully
                const name = team[0] || `Group ${index + 1}`;
                const p1 = team[1] || "0";
                const p2 = team[2] || "0";
                const p3 = team[3] || "0";

                const rowHTML = `
                    <tr class="${isWinner ? 'winner' : ''}">
                        <td><strong>${name}</strong></td>
                        <td>${p1}</td>
                        <td>${p2}</td>
                        <td>${p3}</td>
                        <td><strong>${currentTeamScore}</strong></td>
                    </tr>
                `;
                tbody.insertAdjacentHTML("beforeend", rowHTML);
            });
        }

        // Run immediately on boot and cycle strictly every 5 seconds
        fetchGameData();
        setInterval(fetchGameData, 5000);
    </script>
